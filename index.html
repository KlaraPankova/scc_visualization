<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="mode-select">
        <button id="mode-sparse-btn" onclick="selectMode('sparse')">Sparse</button>
        <button id="mode-dense-btn" onclick="selectMode('dense')">Dense</button>
        <span id="mode-status">No mode selected</span>
    </div>

<div id="graph-controls">
    <!-- generate graph with input nodes-->
    <input type="number" id="nodeInput" placeholder="Enter nodes (comma separated)">
    <button onclick="generateGraph()">Generate Graph</button>

    <!-- add edge from input --> 
    <input type="number" id="sourceNode" placeholder="Source Node">
    <input type="number" id="targetNode" placeholder="Target Node">
    <button id="add-edge-btn" onclick="addEdge()">Add Edge</button>
    <button id="add-edge-fast-btn" onclick="addEdgeFast()">Add Edge (all at once)</button>
    <button id="next-step-bnt" onclick="nextStep()" disabled>Next Step</button>
</div>
<div id="graph-reset">
    <button onclick="resetGraph()">Reset Graph</button>
    <select id="example-select">
        <option value="0">Example 1</option>
        <option value="1">Example 2</option>
        <option value="2">Example 3</option>
        <option value="3">Example 4</option>
        <option value="4">Example 5</option>
    </select>
    <button onclick="loadExample(document.getElementById('example-select').value)">Load Example</button>
</div>

<div id="author-tools">
  <button onclick="exportExample()">Export current graph as example</button>
  <span id="export-status"></span>
  <textarea id="export-output" rows="10" cols="60" readonly></textarea>
</div>-->
    <div id="cy" style="width: 600px; height: 400px; border: 1px solid #ccc;"></div>
    <div id="log-panel" style="width: 600px; max-height: 200px; overflow-y: auto; border: 1px solid #ccc; padding: 0.5rem; font-family: monospace; font-size: 0.85rem;"></div>
    <div id="vertex-details" style="width: 300px; border: 1px solid #ccc; padding: 0.5rem; font-family: monospace; font-size: 0.85rem;">
        <em>Click a node to inspect it.</em>
    </div>

    <script src="https://unpkg.com/cytoscape@3.30.1/dist/cytoscape.min.js"></script>
    <script src="https://unpkg.com/layout-base@2.0.1/layout-base.js"></script>
    <script src="https://unpkg.com/avsdf-base@1.0.0/avsdf-base.js"></script>
    <script src="https://unpkg.com/cose-base@2.2.0/cose-base.js"></script>
    <script src="https://unpkg.com/cytoscape-cise@2.0.1/cytoscape-cise.js"></script>

    <script src="js/example.js"></script>
    <script src="js/union_find.js"></script>
    <script src="js/sparse_graph.js"></script>
    <script src="js/dense_graph.js"></script>
    <script src="js/state.js"></script>
    <script src="js/cy-draw.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
